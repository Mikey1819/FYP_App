# Classic cartoon theme: cream page, bold black lines, sunny yellow highlights, round shapes.
# Red is kept for real alerts (Critical, failed), so it never doubles as decoration.
# Fonts are local system fonts; nothing is fetched from the internet.

[theme]
base = "light"
primaryColor = "#1C1C1C"
backgroundColor = "#FFF8E7"
secondaryBackgroundColor = "#FFF0C2"
textColor = "#1C1C1C"
linkColor = "#1C1C1C"
borderColor = "#1C1C1C"
showWidgetBorder = true
baseRadius = "large"
buttonRadius = "full"
headingFont = "\"Arial Rounded MT\", sans-serif"
dataframeHeaderBackgroundColor = "#FFC72C"
dataframeBorderColor = "#1C1C1C"
codeBackgroundColor = "#FFF0C2"
redColor = "#D62828"
yellowColor = "#E0A800"

[theme.sidebar]
backgroundColor = "#1C1C1C"
secondaryBackgroundColor = "#2E2E2E"
textColor = "#FFF8E7"
primaryColor = "#FFC72C"
linkColor = "#FFC72C"
borderColor = "#FFC72C"

[client]
# Hides the "Deploy" button: this workspace runs locally only.
toolbarMode = "minimal"

[server]
# No hot reload. Streamlit's watcher evicts every app module on a source file event (OneDrive and indexers
# can raise them), while the ledger and the live SSH session in session_state keep the old classes; the
# Ubuntu store then rejected a valid workflow binding. Restart the app to load code changes.
fileWatcherType = "none"
runOnSave = false
